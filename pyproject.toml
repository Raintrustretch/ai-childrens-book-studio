[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-childrens-book-studio"
version = "0.9.4"
description = "Desktop studio that generates illustrated children's picture books (text + art) fully offline."
requires-python = ">=3.11"
authors = [{ name = "Sam" }]
readme = "README.md"
dependencies = [
    "PySide6>=6.6",
    "llama-cpp-python>=0.2.70",
    "diffusers>=0.27",
    "torch>=2.2",
    "Pillow>=10.2",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
bookstudio = "bookstudio.__main__:main"

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]